<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperatura</title>

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Título principal da aplicação -->
<h1>🌡️ Conversor de Temperatura</h1>

        <p>Converta temperaturas entre Celsius, Fahrenheit e Kelvin.</p>

        <div class="formulario">

            <label for="temperatura">Temperatura</label>

          <input
    type="number"
    id="temperatura"
    placeholder="Digite a temperatura"
    aria-label="Campo para digitar a temperatura">

            <label for="origem">Converter de</label>

            <select id="origem">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>

            <label for="destino">Para</label>

            <select id="destino">
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="celsius">Celsius (°C)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>

            <div class="botoes">
                <button onclick="converter()">
                    Converter
                </button>

                <button onclick="limparCampos()" class="limpar">
                    Limpar
                </button>
            </div>

        </div>

        <div id="resultado">
            Resultado aparecerá aqui.
        </div>

    </div>

    <!-- Arquivo JavaScript -->
    <script src="script.js"></script>

</body>
</html>
